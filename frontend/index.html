<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Eredan</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="entete">
  <h1>URBAN ERE<span>DAN</span></h1>
  <p class="sous-titre">Prototype solo vs IA</p>
</header>

<main id="app">

  <!-- Ecran : selection d'equipe -->
  <section id="ecran-selection" class="ecran">
    <h2>Choisis ton equipe (4 Combattants)</h2>
    <p class="aide">Clique sur 4 Combattants pour constituer ton equipe. L'IA recevera automatiquement les 4 restants.</p>
    <div id="grille-selection" class="grille-combattants"></div>
    <div class="barre-action">
      <span id="compteur-selection">0 / 4 selectionnes</span>
      <button id="btn-selection-aleatoire" class="secondaire" type="button">Selection aleatoire</button>
      <button id="btn-lancer-partie" disabled>Lancer la partie</button>
    </div>
  </section>

  <!-- Ecran : partie en cours -->
  <section id="ecran-partie" class="ecran cache">
    <div class="tableau-bord">
      <div class="joueur-info joueur-humain">
        <h3>Toi</h3>
        <div id="pv-humain-ronds" class="pv-ronds"></div>
        <span id="pv-humain-texte" class="pv-texte">10 PV</span>
      </div>
      <div class="duel-compteur">
        <span id="duel-numero-texte">Duel 1 / 4</span>
      </div>
      <div class="joueur-info joueur-ia">
        <h3>IA</h3>
        <div id="pv-ia-ronds" class="pv-ronds"></div>
        <span id="pv-ia-texte" class="pv-texte">10 PV</span>
      </div>
    </div>

    <div class="zone-duel">
      <div class="cote-duel">
        <h4>Ton equipe</h4>
        <div id="equipe-humain" class="grille-combattants petite"></div>
      </div>

      <div class="centre-duel">
        <div id="combattants-en-duel" class="combattants-en-duel"></div>
        <div id="zone-pioche" class="zone-pioche cache">
          <p id="pioche-tas-restant" class="pioche-tas-restant"></p>
          <div class="pioche-cote">
            <span class="pioche-libelle">Tes cartes piochees :</span>
            <div id="mes-cartes-piochees" class="grille-cartes"></div>
            <p id="mes-totaux-pioche" class="totaux-pioche"></p>
          </div>
          <div class="pioche-cote">
            <span class="pioche-libelle">IA :</span>
            <p id="statut-pioche-ia" class="statut-pioche-adverse"></p>
          </div>
          <div id="actions-pioche" class="actions-pioche">
            <button id="btn-piocher">Piocher une carte</button>
            <button id="btn-arreter" class="secondaire">S'arreter</button>
          </div>
        </div>
        <div id="zone-resultat" class="zone-resultat cache">
          <div id="journal-resolution" class="journal"></div>
          <button id="btn-duel-suivant">Duel suivant</button>
        </div>
        <div id="message-attente" class="message-attente cache"></div>
      </div>

      <div class="cote-duel">
        <h4>Equipe IA</h4>
        <div id="equipe-ia" class="grille-combattants petite"></div>
      </div>
    </div>
  </section>

  <!-- Ecran : fin de partie -->
  <section id="ecran-fin" class="ecran cache">
    <h2 id="titre-fin"></h2>
    <p id="detail-fin"></p>
    <button id="btn-nouvelle-partie">Nouvelle partie</button>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
